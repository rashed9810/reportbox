# ReportBox on one Linux server. From this folder:
#   cp .env.prod.example .env    (then fill it in)
#   docker compose -f docker-compose.prod.yml up -d --build
# See ../docs/DEPLOY.md for the full steps.

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://reportbox:${POSTGRES_PASSWORD}@db:5432/reportbox
  AUTO_CREATE_TABLES: "false"
  COOKIE_SECURE: "true"
  SHOW_API_DOCS: "false"
  CORS_ORIGINS: ""
  STORAGE_DIR: /data/storage
  PUBLIC_BASE_URL: https://${DOMAIN}
  SECRET_KEY: ${SECRET_KEY}
  FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_SENDER_ID: ${SMS_SENDER_ID:-}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  WA_API_VERSION: ${WA_API_VERSION:-v23.0}
  WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
  WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
  WA_APP_SECRET: ${WA_APP_SECRET:-}
  WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
  WA_TEMPLATE_REPORT_READY: ${WA_TEMPLATE_REPORT_READY:-report_ready}
  VAT_PERCENT: ${VAT_PERCENT:-0}
  PAYMENT_BKASH_NUMBER: ${PAYMENT_BKASH_NUMBER:-}
  PAYMENT_NAGAD_NUMBER: ${PAYMENT_NAGAD_NUMBER:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: reportbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reportbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportbox -d reportbox"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    environment: *api-env
    volumes:
      - reports:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - reports:/data/storage
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: reportbox
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: reportbox
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - reports:/data/storage:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  reports:
  caddy_data:
  caddy_config:
