# Postgres database for local development: `docker compose up -d`
# Then set DATABASE_URL=postgresql+psycopg://reportbox:reportbox@localhost:5432/reportbox in backend/.env
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reportbox
      POSTGRES_PASSWORD: reportbox
      POSTGRES_DB: reportbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
